name: CI
# QuikIT uses npm (npm 11 / Node 20+). Gate = lint + typecheck + test (+ build).
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 } # add `cache: npm` and use `npm ci` once package-lock.json is committed
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
